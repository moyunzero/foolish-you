appId: com.moyunzero.foolish-you
ios:
  snapshotKeyHonorModalViews: true
---
# D-05 — missed-yesterday recall wins over Sunday Special (never stacked).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: '完成今日'
    timeout: 60000
- runFlow: subflows/dev-force-sunday.yaml
- runFlow: ../v22/subflows/dev-open-panel.yaml
- tapOn:
    text: '漏签召回'
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: ../v22/subflows/dev-hide-bar.yaml
- assertNotVisible: '今天是周日特辑。'
- extendedWaitUntil:
    visible:
      id: 'game-streak-subline'
    timeout: 20000
- takeScreenshot: 03-d05-recall-wins.png
