appId: com.moyunzero.foolish-you
ios:
  snapshotKeyHonorModalViews: true
---
# SC-01 / D-07 / D-11 — Sunday roast + single growth/smoother line (not stacked as dual brands).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: '完成今日'
    timeout: 60000
- runFlow: subflows/dev-force-sunday.yaml
- runFlow: subflows/dev-clear-streak.yaml
- runFlow: ../v22/subflows/dev-force-sudoku.yaml
- runFlow: ../v22/subflows/dev-open-panel.yaml
- tapOn:
    text: '彩蛋·同类更顺'
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 45000
- runFlow: ../v22/subflows/dev-open-panel.yaml
- tapOn:
    text: '一键通关'
- extendedWaitUntil:
    visible: '今日战绩 · 通关'
    timeout: 60000
- runFlow: ../v22/subflows/dev-hide-bar.yaml
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: result-punchline
    timeout: 20000
- assertVisible: '今日 · 2026-07-12'
# D-11: growth/smoother still at most one dedicated line.
- extendedWaitUntil:
    visible:
      id: result-growth-line
    timeout: 20000
- takeScreenshot: 04-sunday-complete-roast.png
- runFlow: ../v22/subflows/wait-result-ready.yaml
