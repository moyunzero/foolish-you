appId: com.moyunzero.foolish-you
ios:
  snapshotKeyHonorModalViews: true
---
# Hand QA assist — Sunday pin + one enter-game smoke (H2 corroboration).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 60000
- runFlow: ../v24/subflows/dev-force-sunday.yaml
- runFlow: ../v22/subflows/dev-open-panel.yaml
- tapOn:
    text: '数独'
    below: 'DEV 调试'
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 45000
- runFlow:
    when:
      visible: '知道了'
    commands:
      - tapOn: '知道了'
- runFlow: ../v22/subflows/dev-hide-bar.yaml
- assertVisible: '数独'
- takeScreenshot: h2-sunday-sudoku
