appId: com.moyunzero.foolish-you
ios:
  snapshotKeyHonorModalViews: true
---
# v2.5-01 visual audit — result + calendar (zh-Hans, __DEV__)
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: '完成今日'
    timeout: 90000
- takeScreenshot: 01-game-fresh
- runFlow: ../v22/subflows/dev-open-panel.yaml
- tapOn:
    text: '一键通关'
- extendedWaitUntil:
    visible: '今日战绩 · 通关'
    timeout: 60000
- tapOn:
    text: '隐藏'
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 02-result-first-fold
- swipe:
    direction: UP
    duration: 400
- swipe:
    direction: UP
    duration: 400
- swipe:
    direction: UP
    duration: 400
- takeScreenshot: 03-result-below-fold
- tapOn:
    text: '查看本月'
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: calendar-month-sheet
    timeout: 20000
- takeScreenshot: 04-calendar-sheet
- assertVisible:
    text: '六'
- assertVisible:
    text: '生成本月图鉴'
