appId: com.moyunzero.foolish-you
ios:
  snapshotKeyHonorModalViews: true
---
# D-12 H2 — in-progress keep: fill one cell → kill → relaunch without clearState.
# Do NOT Dev-force mid-check (that clears today's archive).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 60000
- runFlow: ../v22/subflows/dev-open-panel.yaml
- tapOn:
    text: '数独'
    below: 'DEV 调试'
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 45000
- runFlow:
    when:
      visible: '知道了'
    commands:
      - tapOn: '知道了'
- runFlow: ../v22/subflows/dev-hide-bar.yaml
- assertVisible: '数独'
- tapOn: '第 1 行第 1 列，空'
- tapOn: '填入 7'
- extendedWaitUntil:
    visible: '第 1 行第 1 列，已填 7'
    timeout: 15000
- takeScreenshot: 05-keep-before-kill
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 60000
- assertVisible: '数独'
- assertVisible: '第 1 行第 1 列，已填 7'
- takeScreenshot: 06-keep-after-relaunch
