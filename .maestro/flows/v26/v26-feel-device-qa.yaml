appId: com.moyunzero.foolish-you
ios:
  snapshotKeyHonorModalViews: true
---
# v2.6-02 Plan 02 device QA
# Prerequisite: device/simulator system language Chinese (zh) — flows assert zh UI/a11y copy.
# Each type uses a fresh launch so we can hide DEV bar without needing re-show on game.

# ========== Binary: drag-fill + undo + vertical scroll ==========
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '跳过题型介绍，进入棋盘'
    timeout: 90000
- tapOn: '跳过题型介绍，进入棋盘'
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 60000
- runFlow: ../v22/subflows/dev-open-panel.yaml
- tapOn:
    text: '二进制'
    below: 'DEV 调试'
- extendedWaitUntil:
    visible: '跳过题型介绍，进入棋盘'
    timeout: 60000
- tapOn: '跳过题型介绍，进入棋盘'
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    text: '隐藏调试条，便于截图'
    optional: true
- tapOn:
    text: 'DEV 调试'
    optional: true
- waitForAnimationToEnd
# Evening banner shifts board Y — dismiss if present.
- runFlow:
    when:
      visible: '稍后'
    commands:
      - tapOn: '稍后'
      - waitForAnimationToEnd
- assertVisible: '二进制'
- assertVisible:
    text: '撤销上一步编辑'
    enabled: false
- takeScreenshot: v26-01-binary-fresh

# No pre-swipe tap — Undo enabled must come from the drag stroke only (D-04).
# Start drag FROM an empty cell so RNGH Pan receives the gesture (percent swipe is flaky).
- swipe:
    from:
      text: '.*，空$'
    direction: RIGHT
    duration: 1200
- waitForAnimationToEnd
- assertVisible:
    text: '撤销上一步编辑'
    enabled: true
- takeScreenshot: v26-02-binary-after-drag

- tapOn: '撤销上一步编辑'
- waitForAnimationToEnd
- assertVisible:
    text: '撤销上一步编辑'
    enabled: false
- takeScreenshot: v26-03-binary-after-undo

- swipe:
    start: 50%, 62%
    end: 50%, 28%
    duration: 500
- assertVisible: '撤销上一步编辑'
- assertVisible: '完成今日'
- takeScreenshot: v26-04-binary-after-scroll

