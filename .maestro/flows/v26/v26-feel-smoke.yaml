appId: com.moyunzero.foolish-you
ios:
  snapshotKeyHonorModalViews: true
---
# v2.6-02 Feel smoke (SHIP-02) — launch → board; Skip intro if shown; no Hint path.
# Prerequisite: device/simulator system language Chinese (zh) — flows assert zh UI/a11y copy.
# Companion to v26-feel-device-qa.yaml (Plan 02 drag/hit).
# Intro buttons use a11y labels (skipA11y), not visible copy.

- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '跳过题型介绍，进入棋盘'
    timeout: 90000
- tapOn: '跳过题型介绍，进入棋盘'
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 60000
- runFlow: ../v22/subflows/dev-open-panel.yaml
- tapOn:
    text: '数独'
    below: 'DEV 调试'
# Re-selecting today's type usually skips first-intro — only dismiss if shown.
- runFlow:
    when:
      visible: '跳过题型介绍，进入棋盘'
    commands:
      - tapOn: '跳过题型介绍，进入棋盘'
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    text: '隐藏调试条，便于截图'
    optional: true
- tapOn:
    text: 'DEV 调试'
    optional: true
- waitForAnimationToEnd
- assertVisible: '数独'
- assertVisible: '完成今日'
- assertVisible: '切换笔记模式；开启时数字键填写候选笔记'

# No Hint / difficulty badge path (D-24)
- assertNotVisible: 'Hint'
- assertNotVisible: '提示'
- assertNotVisible: '一键填满'

- takeScreenshot: v26-feel-smoke-sudoku
