appId: com.moyunzero.foolish-you
ios:
  snapshotKeyHonorModalViews: true
---
# Manual QA #7 — 首月抑制：清空 history 后仅本月通关，月历无 growth delta。
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: '完成今日'
    timeout: 60000
- runFlow: subflows/dev-force-sudoku.yaml
- runFlow: subflows/dev-reset-history.yaml
- runFlow: subflows/dev-open-panel.yaml
- tapOn:
    text: '一键通关'
- extendedWaitUntil:
    visible: '今日战绩 · 通关'
    timeout: 60000
- runFlow: subflows/dev-hide-bar.yaml
- runFlow: subflows/wait-result-ready.yaml
- tapOn:
    text: '查看本月日历'
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: calendar-month-sheet
    timeout: 20000
- assertNotVisible:
    id: calendar-growth-delta
- takeScreenshot: 07-calendar-first-month-no-delta
