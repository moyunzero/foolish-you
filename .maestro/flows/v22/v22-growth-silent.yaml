appId: com.moyunzero.foolish-you
ios:
  snapshotKeyHonorModalViews: true
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: '完成今日'
    timeout: 60000
- runFlow: subflows/dev-force-sudoku.yaml
- runFlow: subflows/dev-open-panel.yaml
- tapOn:
    text: '近况·平常'
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 45000
- runFlow: subflows/dev-open-panel.yaml
- tapOn:
    text: '一键通关'
- extendedWaitUntil:
    visible: '今日战绩 · 通关'
    timeout: 60000
- runFlow: subflows/dev-hide-bar.yaml
- runFlow: subflows/wait-result-ready.yaml
- assertNotVisible:
    id: result-growth-line
- takeScreenshot: 01-result-silent-no-growth-line
