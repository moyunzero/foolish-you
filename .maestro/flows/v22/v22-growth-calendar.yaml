appId: com.moyunzero.foolish-you
ios:
  snapshotKeyHonorModalViews: true
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: '完成今日'
    timeout: 90000
- runFlow: subflows/dev-force-sudoku.yaml
- runFlow: subflows/dev-open-panel.yaml
- tapOn:
    text: '月历·比上月多'
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 45000
- runFlow: subflows/dev-open-panel.yaml
- tapOn:
    text: '一键通关'
- extendedWaitUntil:
    visible: '今日战绩 · 通关'
    timeout: 60000
- runFlow: subflows/dev-hide-bar.yaml
- runFlow: subflows/wait-result-ready.yaml
- tapOn:
    text: '查看本月日历'
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: calendar-month-sheet
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: calendar-growth-delta
    timeout: 30000
- assertVisible:
    id: calendar-growth-delta
- takeScreenshot: 05-calendar-growth-delta
