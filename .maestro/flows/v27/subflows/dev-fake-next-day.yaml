appId: com.moyunzero.foolish-you
---
# Advance in-memory calendar +1 without regenerating (carry / Freeze QA).
# Tap a11y label — DevButton sets accessibilityLabel overriding visible「假日期·次日」.
- runFlow: ../../v22/subflows/dev-open-panel.yaml
- tapOn: '假日期次日，不换题，仅用于续局手测'
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
