appId: com.moyunzero.foolish-you
---
# Advance in-memory calendar +1 without regenerating (carry / Freeze QA).
# Boundary: force-type regenerate (esp. slitherlink) can still be in flight —
# tapping「假日期·次日」while disabled is a Maestro COMPLETED no-op (no 续局).
# Wait out「正在生成」before tap; retry once if carry chip missing.
- runFlow: ../../v22/subflows/dev-open-panel.yaml
- extendedWaitUntil:
    notVisible: '正在生成今日题目…'
    timeout: 180000
- tapOn: '假日期次日，不换题，仅用于续局手测'
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    notVisible: '正在生成今日题目…'
    timeout: 60000
- runFlow:
    when:
      notVisible: '续局'
    commands:
      - tapOn: '假日期次日，不换题，仅用于续局手测'
      - waitForAnimationToEnd:
          timeout: 10000
      - extendedWaitUntil:
          notVisible: '正在生成今日题目…'
          timeout: 60000
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 120000
- extendedWaitUntil:
    visible: '续局'
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 5000
