appId: com.moyunzero.foolish-you
ios:
  snapshotKeyHonorModalViews: true
---
# v2.7-03 CARRY-03 smoke (Simulator / Maestro)
# Prerequisite: zh UI; DEV build; Metro for latest DevTools ("打开月历").

- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    visible: '跳过题型介绍，进入棋盘'
    timeout: 180000
- tapOn: '跳过题型介绍，进入棋盘'
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 90000
- runFlow: ../v22/subflows/dev-open-panel.yaml
- tapOn:
    text: '数独'
    below: 'DEV 调试'
- runFlow:
    when:
      visible: '跳过题型介绍，进入棋盘'
    commands:
      - tapOn: '跳过题型介绍，进入棋盘'
- extendedWaitUntil:
    visible: '完成今日'
    timeout: 60000
- runFlow: subflows/dev-fake-next-day.yaml
- assertVisible: '续局'
- assertVisible: '完成今日'
- takeScreenshot: 01-carry-after-fake-next-day
- runFlow: subflows/dev-open-calendar.yaml
# Full a11y label — substring「进行中」alone is not matched by Maestro on iOS cells.
# Opening day is calendar-1 after「假日期·次日」from a clearState launch on device today.
- assertVisible: '.*日 · 进行中.*'
- takeScreenshot: 02-calendar-in-progress
- tapOn: '关闭月历'
- swipe:
    direction: DOWN
    duration: 500
- extendedWaitUntil:
    visible: '一键通关'
    timeout: 20000
# Growth hint no longer contains「一键通关」— tap the DevButton label only.
- tapOn:
    text: '一键通关'
    below: '温和成长 QA（注入 history → 通关注入 → 结果页 / 月历）'
# First completion triggers SKStoreReview — dismiss before result asserts.
- runFlow:
    when:
      visible: '以后'
    commands:
      - tapOn: '以后'
- tapOn:
    text: '隐藏调试条，便于截图'
    optional: true
- swipe:
    direction: UP
- extendedWaitUntil:
    visible: '查看本月日历'
    timeout: 60000
- takeScreenshot: 03-complete-after-carry
- assertVisible: '查看本月日历'
